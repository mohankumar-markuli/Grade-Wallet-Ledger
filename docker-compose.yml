services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wallet_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["node", "scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wallet_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-wallet_db}
      MIGRATION_EXPECTED_DATABASE: ${POSTGRES_DB:-wallet_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-test:
    build: .
    command: ["node", "scripts/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wallet_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/wallet_test_db
      MIGRATION_EXPECTED_DATABASE: wallet_test_db
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]
    restart: "no"

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-wallet_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-wallet_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RECONCILIATION_ADMIN_TOKEN: ${RECONCILIATION_ADMIN_TOKEN:?Set RECONCILIATION_ADMIN_TOKEN in .env}
      ENABLE_RECONCILIATION_SCHEDULER: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-wallet_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-wallet_db}
      RECONCILIATION_EXPECTED_DATABASE: ${POSTGRES_DB:-wallet_db}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  wallet_postgres_data:
